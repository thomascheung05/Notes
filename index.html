<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
      --border: #d0d7de; --accent: #0969da; --code-bg: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0;
        --border: #30363d; --accent: #4493f8; --code-bg: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    nav {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 4px; padding: 0 16px; overflow-x: auto;
    }
    nav a {
      padding: 12px 14px; color: var(--muted); text-decoration: none;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    nav a:hover { color: var(--fg); }
    nav a.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--accent); }
    h1, h2, h3 { line-height: 1.25; }
    h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em; background: var(--code-bg); padding: .15em .35em; border-radius: 4px;
    }
    pre {
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 12px 16px; border-radius: 6px; overflow-x: auto;
    }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid var(--border); padding: 6px 12px; }
    blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
    .error { color: #cf222e; }
  </style>
</head>
<body>
  <nav id="tabs"></nav>
  <main id="content">Loading…</main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    // ---- Add a tab: put a .md file in notes/ and add a line here. ----
    const TABS = [
      { name: "vim", file: "notes/vim.md" },
      { name: "fish", file: "notes/fish.md" },
      { name: "venv", file: "notes/venv.md" },
      { name: "git", file: "notes/git.md" },
      { name: "pyinstaller", file: "notes/pyinstaller.md" },
    ];
    // -------------------------------------------------------------------

    const nav = document.getElementById("tabs");
    const content = document.getElementById("content");

    TABS.forEach(t => {
      const a = document.createElement("a");
      a.href = "#" + encodeURIComponent(t.name);
      a.textContent = t.name;
      nav.appendChild(a);
    });

    async function show() {
      const name = decodeURIComponent(location.hash.slice(1)) || TABS[0].name;
      const tab = TABS.find(t => t.name === name) || TABS[0];
      [...nav.children].forEach(a => a.classList.toggle("active", a.textContent === tab.name));
      document.title = tab.name + " · Notes";
      try {
        const res = await fetch(tab.file, { cache: "no-cache" });
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        content.innerHTML = marked.parse(await res.text());
      } catch (e) {
        content.innerHTML = `<p class="error">Couldn't load ${tab.file}: ${e.message}</p>`;
      }
    }

    window.addEventListener("hashchange", show);
    show();
  </script>
</body>
</html>
